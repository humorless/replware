name: Deploy

on:
  push:
    branches:
      - boot-code

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout boot-code
        uses: actions/checkout@v4

      - name: Verify site files
        run: |
          test -f resources/public/index.html
          test -f resources/public/CNAME
          ls -la resources/public/

      - name: Deploy to master
        if: ${{ !env.ACT }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: master
          folder: resources/public
          clean: true
